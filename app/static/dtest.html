<!DOCTYPE html><html><body>
<div id="period-label"></div>
<div id="period-bar"></div>
<div id="sankey"></div>
<div id="metrics"></div>
<div id="out" style="white-space:pre-wrap; font-size:12px">pending</div>
<script id="view-data" type="application/json"></script>
<script src="/static/js/flow.js"></script>
<script src="/static/js/metrics.js"></script>
<script>
window.errors = [];
window.onerror = (m) => { window.errors.push(m); };
(async () => {
  const html = await fetch("/c/sh600519").then(r => r.text());
  const doc = new DOMParser().parseFromString(html, "text/html");
  document.getElementById("view-data").textContent =
    doc.getElementById("view-data").textContent;
  const holder = document.createElement("div");
  holder.innerHTML = doc.querySelector(".sankey-tools").outerHTML +
    '<div id="derive" class="derive-panel" hidden></div>';
  document.body.appendChild(holder);
  const s = document.createElement("script");
  s.src = "/static/js/company.js";
  s.onload = () => {
    try {
      document.getElementById("derive-btn").click();
      const d = document.getElementById("derive");
      document.getElementById("out").textContent =
        (d.hidden ? "STILL-HIDDEN" : "OK展开") +
        " len=" + d.innerHTML.length +
        " errors=" + JSON.stringify(window.errors) + "\n" +
        d.innerText.slice(0, 1200);
    } catch (e) { document.getElementById("out").textContent = "CLICKFAIL " + e.message; }
  };
  document.body.appendChild(s);
})();
</script></body></html>
